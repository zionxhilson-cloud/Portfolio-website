<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Number Dice Game</title>
    <!-- Link to your CSS file -->
    <link rel="stylesheet" href="Gen.css">
</head>
<body>

<!-- Game title -->
<h1>Dice Game: Roll a 3 then a 6!</h1>

<!-- Button the user clicks to roll the dice -->
<button id="myButton">Roll Dice</button><br><br>

<!-- Image of the dice -->
<img id="diceImage" src="dice1.png" width="120"><br><br>

<!-- Label to display messages to the player -->
<label id="Label1" class="myLabels">Roll a 3 to start!</label><br><br>

<!-- Display the current game stage -->
<p>Stage: <span id="stage">Roll a 3</span></p>

<!-- Display number of wins -->
<p>Wins: <span id="score">0</span></p>

<!-- Confetti emoji container for winning -->
<div id="confetti"></div>

<!-- Link to your JS file -->
<script src="Gen.js"></script>
</body>
</html>
